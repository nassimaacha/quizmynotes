/* ---------- server connection (Vercel function holding the API key) ---------- */
const TOK_KEY = 'stetho.token';
let memTok = '';
function getTok(){ try { return localStorage.getItem(TOK_KEY) || memTok; } catch { return memTok; } }
function setTok(v){ memTok = v || ''; try { v ? localStorage.setItem(TOK_KEY, v) : localStorage.removeItem(TOK_KEY); } catch {} }
function authHeaders(){ const tk = getTok(); return tk ? { authorization: 'Bearer ' + tk } : {}; }
try { localStorage.removeItem('stetho.pw'); } catch {}

async function smallJpeg(blob){
  const bmp = await createImageBitmap(blob);
  const scale = Math.min(1, Math.sqrt(1.15e6 / (bmp.width * bmp.height)));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(bmp.width * scale)); c.height = Math.max(1, Math.round(bmp.height * scale));
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(bmp, 0, 0, c.width, c.height);
  const url = c.toDataURL('image/jpeg', 0.8);
  return { media_type: 'image/jpeg', data: url.slice(url.indexOf(',') + 1) };
}
async function packImages(blobs){
  const out = []; let total = 0;
  for (const b of blobs || []){
    try {
      const im = await smallJpeg(b);
      if (total + im.data.length > 3.4e6) break; // Vercel accepts request bodies up to about 4.5 MB
      total += im.data.length; out.push(im);
    } catch {}
  }
  return out;
}
const STOP = '\n[[STETHO:';
async function callClaude(prompt, opts = {}){
  const { signal, onText, images, maxTokens, purpose, part } = opts;
  const imgs = await packImages(images);
  let res;
  try {
    res = await fetch('/api/claude', {
      method: 'POST', signal,
      headers: { 'content-type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ prompt, images: imgs, max_tokens: maxTokens || 8000, purpose: purpose || 'generate', part: part || 1 })
    });
  } catch (e) { throw { code: (signal && signal.aborted) ? 'cancelled' : 'network' }; }
  if (res.status === 401) throw { code: 'unauthorized' };
  if (!res.ok){ let j = {}; try { j = await res.json(); } catch {} throw { code: j.error || (res.status === 429 ? 'rate_limited' : res.status === 413 ? 'prompt_too_large' : 'upstream_error') }; }
  const reader = res.body.getReader(); const dec = new TextDecoder();
  let raw = '';
  try {
    for (;;){
      const { done, value } = await reader.read();
      if (done) break;
      raw += dec.decode(value, { stream: true });
      const visible = raw.split(STOP)[0];
      if (onText && visible.trim()) onText({ text: visible });
    }
  } catch (e) { throw { code: (signal && signal.aborted) ? 'cancelled' : 'network', text: raw.split(STOP)[0] }; }
  const text = raw.split(STOP)[0];
  const m = raw.match(/\n\[\[STETHO:([a-z_]+)\]\]/);
  if (m && m[1] !== 'truncated') throw { code: m[1], text };
  if (!text.trim()) throw { code: 'empty_completion' };
  return { text, truncated: !!m };
}
function parseLoose(text){
  const tryParse = s => { try { return JSON.parse(s); } catch { return undefined; } };
  let v = tryParse(text.trim()); if (v !== undefined) return v;
  const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/); if (fence){ v = tryParse(fence[1].trim()); if (v !== undefined) return v; }
  const a = text.search(/[\[{]/), b = Math.max(text.lastIndexOf('}'), text.lastIndexOf(']'));
  if (a >= 0 && b > a){ v = tryParse(text.slice(a, b + 1)); if (v !== undefined) return v; }
  // cut short: keep every complete question
  const q = text.indexOf('"questions"');
  if (q >= 0){
    let end = text.length;
    for (let k = 0; k < 80; k++){
      end = text.lastIndexOf('}', end - 1);
      if (end <= q) break;
      v = tryParse(text.slice(text.indexOf('{'), end + 1) + ']}');
      if (v !== undefined) return v;
    }
  }
  return undefined;
}
const AI = {
  async json(prompt, opts = {}){
    const r = await callClaude(prompt, opts);
    const v = parseLoose(r.text);
    if (v === undefined) throw { code: 'invalid_json', text: r.text };
    return v;
  }
};
S.sample = AI;
S.maxImages = 10;

/* ---------- accounts ---------- */
function authTab(tab){
  $('#authTabs').querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tab === tab)));
  $('#authTabs').hidden = false;
  $('#loginForm').hidden = tab !== 'login';
  $('#signupForm').hidden = tab !== 'signup';
  $('#pendingBox').hidden = true;
  $('#loginErr').textContent = ''; $('#signupErr').textContent = '';
  setTimeout(() => (tab === 'login' ? $('#loginEmail').value ? $('#loginPw') : $('#loginEmail') : $('#suName')).focus(), 30);
}
// Open the login window. Signs out first only when the session was lost.
function showGate(err, tab, note){
  if (err || !S.user){ setTok(''); S.user = null; renderUser(); updateGenHint(); }
  $('#gate').hidden = false;
  authTab(tab || 'login');
  $('#loginPw').value = '';
  $('#loginErr').textContent = err || '';
  $('#gateNote').textContent = note || '';
  $('#gateNote').hidden = !note;
}
function closeGate(){ $('#gate').hidden = true; }
function signOut(){ setTok(''); S.user = null; renderUser(); updateGenHint(); }
$('#loginBtn').onclick = () => showGate();
$('#gateClose').onclick = closeGate;
$('#gate').addEventListener('click', e => { if (e.target === $('#gate')) closeGate(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#gate').hidden) closeGate(); });
function setUser(u){
  S.user = u; renderUser(); updateGenHint();
}
async function authCall(body){
  let r;
  try {
    r = await fetch('/api/auth', { method: 'POST', headers: { 'content-type': 'application/json', ...authHeaders() }, body: JSON.stringify(body) });
  } catch { return { error: 'network' }; }
  let j = {}; try { j = await r.json(); } catch {}
  if (!r.ok) return { error: j.error || 'upstream_error' };
  return j;
}
$('#authTabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) authTab(b.dataset.tab); });
$('#backToLogin').onclick = () => authTab('login');
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = e.submitter || $('#loginForm button[type=submit]');
  btn.disabled = true; $('#loginErr').textContent = t('working');
  const j = await authCall({ action: 'login', email: $('#loginEmail').value, password: $('#loginPw').value });
  btn.disabled = false;
  if (j.error){ $('#loginErr').textContent = errMsg({ code: j.error }); return; }
  setTok(j.token); setUser(j.user);
  $('#loginPw').value = ''; $('#gate').hidden = true;
});
$('#signupForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = e.submitter || $('#signupForm button[type=submit]');
  btn.disabled = true; $('#signupErr').textContent = t('working');
  const email = $('#suEmail').value;
  const j = await authCall({ action: 'signup', name: $('#suName').value, email, password: $('#suPw').value });
  btn.disabled = false;
  if (j.error && j.error !== 'pending'){ $('#signupErr').textContent = errMsg({ code: j.error }); return; }
  $('#signupErr').textContent = '';
  $('#suPw').value = ''; $('#loginEmail').value = email;
  $('#signupForm').hidden = true; $('#authTabs').hidden = true; $('#pendingBox').hidden = false;
});
$('#logoutBtn').onclick = async () => {
  if (S.test && !S.test.done && S.answers.some((_, i) => answered(i))){
    if (!(await ask(t('quitConfirm'), [{ label: t('cancel'), value: false }, { label: t('logout'), value: true, cls: 'primary' }]))) return;
    clearInterval(S.tick); S.test = null; show('setup');
  }
  await authCall({ action: 'logout' });
  signOut();
};
(async () => {
  renderUser();
  if (!getTok()) return;
  try {
    const r = await fetch('/api/auth', { headers: authHeaders() });
    let j = {}; try { j = await r.json(); } catch {}
    if (r.status === 401) { signOut(); return; }
    if (r.status === 403) { showGate(errMsg({ code: j.error })); return; }
    if (r.ok && j.user) setUser(j.user);
    else if (j.error) toast(errMsg({ code: j.error }));
  } catch { toast(t('eNetwork')); }
})();
renderMeter();
</script>
